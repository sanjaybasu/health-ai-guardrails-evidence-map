  - Labeling untrusted content
  - Injection and jailbreak detection classifiers
  - OCR sanitization of text embedded in medical images
  - Provenance-aware abstention
  - Input denoising against adversarial image perturbations
  proposed_by_studies: 10
  proposed_by_commentaries: 2
  status: machine_draft

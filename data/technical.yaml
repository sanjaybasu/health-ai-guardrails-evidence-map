    governed environments with access, logging, and retention terms.
  comparator: Consumer or commercial LLM services used without institutional contract or governance
  technology:
  - generative_llm
  aim: Keep identifiable patient data from leaving institutional control or reaching uncontracted third parties.
  variants:
  - Open-weight LLM on on-premises hospital servers

note: Machine draft built from practices that studies tested and commentaries recommended; wording is curated by
  a person before it is final.
families:
  output_filtering: keyword, rule, blocklist, or classifier filters applied to AI inputs or outputs
  grounding_retrieval: retrieval-augmented generation, source citation, knowledge graphs, EHR grounding
  verification_ensembles: LLM-as-judge, self-consistency, second-model or second-vendor verification, ensembles,
    multi-agent debate
  uncertainty_deferral: confidence thresholds, abstention, calibrated deferral to a human, conformal prediction
  prompting: role, few-shot, chain-of-thought, structured, or optimized prompts and system instructions
  model_choice_adaptation: fine-tuning, domain-specific versus general models, model size, open versus closed, local
    deployment
  language_literacy_handling: native-language processing, translation or back-translation, simplification, reading-level
    control
  human_workflow_design: draft versus autonomous modes, review designs, routing to humans, double review, workload
    timing
  alert_design: alert thresholds, tiering, throttling, timing, and display of alerts
  input_data_handling: input formatting, structured data, missing-data handling, multimodal inputs, context length
  monitoring_methods: drift detection, automated evaluation, audit sampling, silent-mode runs, performance dashboards
  agent_tool_design: tool use, agent architectures, action approval gates, sandboxing, memory
  presentation_explanation: explanations, confidence or uncertainty display, shown citations, interface design
  privacy_security_engineering: PHI redaction and de-identification, on-premises models, prompt-injection defenses,
    access limits
controls:
- id: T001
  key: output_harm_hallucination_screen
  family: output_filtering
  question: Should we run a separate automated screen that flags harmful, unsafe, or hallucinated AI content before
    users see it?
  control: Pass AI outputs through a dedicated classifier, probe, rule filter, or knowledge-graph check that flags,
    suppresses, or corrects harmful or hallucinated content.
  comparator: Delivering outputs relying only on the base model's built-in alignment
  technology:
  - generative_llm
  aim: Prevent harmful, biased, false, or misleading content from reaching patients, clinicians, or the public
  variants:
  - Trained harm or hallucination classifier on LLM answers
  - Internal-state probe for hallucination
  - Knowledge-graph fact check
  - Rule-based content filter
  - Screening AI-recommended resources against safety and patient-profile constraints
  - Platform-level misinformation and deepfake detectors
  proposed_by_studies: 13
  proposed_by_commentaries: 11
  status: machine_draft
- id: T002
  key: crisis_detection_escalation
  family: output_filtering
  question: Should we run a separate crisis and risk detector alongside our mental health chatbot that escalates
    at-risk users to humans?
  control: Monitor conversations with an independent classifier or keyword rules for self-harm, emergencies, or
    harmful patterns, then pause, restrict, refer, or alert staff.
  comparator: Conversational LLM handling crisis messages with its own safety behavior
  technology:
  - generative_llm
  aim: Detect suicide risk and emergencies reliably and get at-risk users to human help quickly
  variants:
  - Lightweight classifier or keyword rules
  - Bypassing the LLM and routing to emergency resources
  - Alerting staff
  - Detecting delusion, validation-seeking, method inquiry, or compulsive re-querying
  - Switching to a restricted redirecting safety mode
  proposed_by_studies: 13
  proposed_by_commentaries: 9
  status: machine_draft
- id: T003
  key: clinical_safety_rules
  family: output_filtering
  question: Should we hard-code clinical safety rules that block or escalate AI treatment and dosing recommendations?
  control: Encode contraindications, dose ceilings, interactions, red flags, and guideline rules as hard constraints
    that block, edit, or escalate AI recommendations.
  comparator: AI recommendations passed on without an encoded rule-based safety layer
  technology:
  - generative_llm
  - predictive_risk
  aim: Prevent unsafe treatment, dosing, or triage recommendations from reaching prescribers or patients
  variants:
  - Medication dose-limit and interaction checks
  - Red-flag and protocol rules overriding LLM output
  - Masking reinforcement-learning actions to guideline-permitted options
  - Limiting recommended changes to small increments from current settings
  proposed_by_studies: 22
  proposed_by_commentaries: 3
  status: machine_draft
- id: T004
  key: deterministic_output_checks
  family: output_filtering
  question: Should we run deterministic rule checks for plausibility, source consistency, and completeness on AI
    outputs before they are used or filed?
  control: Apply deterministic rules checking plausibility, cross-field consistency, units, verbatim source evidence,
    required content, omissions, and trusted-list membership; route or discard failures.
  comparator: Using AI outputs directly without rule-based checks
  technology:
  - generative_llm
  aim: Catch implausible, inconsistent, incomplete, unsupported, or untrusted generated content before downstream
    use
  variants:
  - Plausibility and unit checks on extracted data
  - Verbatim evidence matching to source
  - Source-consistency and high-risk omission gate for clinical documents
  - Privacy check before release
  - Binding rules on generated exam questions or synthetic data
  - Checking generated-code dependencies against trusted registries to flag unknown or untrusted packages
  proposed_by_studies: 25
  proposed_by_commentaries: 7
  status: machine_draft
- id: T005
  key: constrained_structured_generation
  family: output_filtering
  question: Should we force the LLM to generate only schema-valid structured output instead of parsing free text
    afterward?
  control: Enforce structured output at generation time using JSON schema, grammar, enum, or candidate-restricted
    constrained decoding, such as FHIR profiles.
  comparator: Free-text generation with prompt instructions and post-hoc parsing
  technology:
  - generative_llm
  aim: Produce reliably parseable, standard-conformant output for EHR and downstream systems
  variants:
  - JSON schema or grammar-constrained decoding
  - Enum or candidate-list restriction
  - HL7 FHIR profile constraints
  proposed_by_studies: 20
  proposed_by_commentaries: 2
  status: machine_draft
- id: T006
  key: post_hoc_validation_repair
  family: output_filtering
  question: Should we validate LLM structured output against schemas and terminologies before it enters downstream
    systems?
  control: Validate structured outputs against schemas and terminologies (FHIR, SNOMED, CPT, HGNC); handle failures
    by repair, retry, fallback, or fail-closed rejection.
  comparator: Accepting structured outputs without schema or terminology validation
  technology:
  - generative_llm
  aim: Prevent invalid codes and malformed output from entering systems and reduce manual rework
  variants:
  - Terminology code validation
  - Automatic repair of invalid items
  - Retry on parse failure or generation loops
  - Fallback to another model
  - Fail-closed rejection
  - Manual correction of flagged failures
  proposed_by_studies: 25
  proposed_by_commentaries: 0
  status: machine_draft
- id: T007
  key: input_quality_gate
  family: output_filtering
  question: Should we automatically reject poor-quality or out-of-distribution inputs before the AI analyzes them
    or releases results?
  control: Screen inputs with automated quality, gradability, relevance, or out-of-distribution checks; withhold
    analysis or reacquire when inputs fail criteria.
  comparator: AI processing and releasing results on all inputs
  technology:
  - imaging_diagnostic
  - any_ai
  aim: Prevent unreliable AI results from poor, irrelevant, or unfamiliar inputs
  variants:
  - Image gradability classifier
  - Out-of-distribution detector
  - Prompting reacquisition of failed inputs
  - Withholding results rather than inference
  proposed_by_studies: 23
  proposed_by_commentaries: 3
  status: machine_draft
- id: T008
  key: input_scope_classifier
  family: output_filtering
  question: Should we classify incoming queries so the chatbot refuses or reroutes requests outside its approved
    scope?
  control: Classify queries for intent, scope, and urgency; refuse or reroute out-of-scope or restricted requests,
    and strip restricted portions from mixed prompts.
  comparator: Chatbot answering every query without a dedicated scope gate
  technology:
  - generative_llm
  aim: Keep the chatbot within approved uses and prevent risky or off-label answers
  variants:
  - Intent and urgency classification
  - Refusal versus rerouting
  - Removing or suppressing restricted portions of mixed prompts
  proposed_by_studies: 10
  proposed_by_commentaries: 3
  status: machine_draft
- id: T009
  key: approved_wording_lock
  family: output_filtering
  question: Should high-risk advice and safety messages use pre-approved fixed wording instead of LLM-generated
    text?
  control: Lock treatment advice and safety messaging to clinician-approved text and mandatory disclaimers, replacing
    unsupported claims in user-facing output.
  comparator: Fully generative LLM wording for all advice and safety messages
  technology:
  - generative_llm
  aim: Ensure high-risk patient-facing messages are accurate, consistent, and safe
  variants:
  - Rule-inserted standardized statements
  - Mandatory disclaimers
  - Replacing unsupported claims or stigmatizing terms
  proposed_by_studies: 4
  proposed_by_commentaries: 2
  status: machine_draft
- id: T010
  key: text_similarity_screen
  family: output_filtering
  question: Should we screen AI-generated text for similarity to existing sources before publishing it?
  control: Check AI-generated text with similarity or plagiarism tools against set thresholds and route flagged
    passages for review or rewriting before use.
  comparator: Publishing AI-generated text without similarity screening
  technology:
  - generative_llm
  aim: Flag possible copying of existing sources in published materials for human review
  variants:
  - Plagiarism threshold on patient education materials
  - Similarity scan to flag possible copyright concerns
  proposed_by_studies: 4
  proposed_by_commentaries: 0
  status: machine_draft
- id: T011
  key: patient_text_language_screen
  family: output_filtering
  question: Should we screen AI-generated patient-facing text for stigmatizing or frightening language before release?
  control: Automatically screen patient-facing text for stigmatizing language and alarming tone, then revise or
    route flagged text before release.
  comparator: Releasing text without automated language or tone screening
  technology:
  - generative_llm
  aim: Prevent stigmatizing or needlessly distressing wording from reaching patients or guardians
  variants:
  - Stigmatizing language detection
  - Tone screening
  proposed_by_studies: 4
  proposed_by_commentaries: 0
  status: machine_draft
- id: T012
  key: confidential_disclosure_screen
  family: output_filtering
  question: Should we screen AI-generated text for potentially inappropriate confidential disclosures before patients
    or proxies see it?
  control: Automatically detect confidential or restricted content in AI-generated text and hold flagged items for
    review before patient or proxy release.
  comparator: Releasing text without automated confidentiality screening
  technology:
  - generative_llm
  aim: Flag potentially inappropriate disclosure of confidential information before release to patients or proxies
  variants:
  - Confidential content screening for guardian or proxy access
  - Restricted-information detection before portal release
  proposed_by_studies: 2
  proposed_by_commentaries: 0
  status: machine_draft
- id: T013
  key: use_context_gating
  family: output_filtering
  question: Should we limit which patients, exams, clinicians, or conditions each AI model is allowed to run for?
  control: Restrict each model to predefined patient populations, exam types, users, clinical conditions, or risk-based
    eligibility, suppressing outputs outside them.
  comparator: Model available for all patients, exams, and situations
  technology:
  - any_ai
  aim: Prevent model use outside validated populations and target it to intended eligible patients
  variants:
  - Population restriction to validated groups
  - Exam-type restriction
  - User-role restriction
  - Risk-based eligibility restricting screening to higher-risk patients
  proposed_by_studies: 1
  proposed_by_commentaries: 3
  status: machine_draft
- id: T014
  key: spatiotemporal_output_postprocessing
  family: output_filtering
  question: Should we apply anatomical, spatial, or temporal post-processing constraints to raw model predictions
    before clinical use?
  control: Post-process raw predictions with anatomical constraints, island selection, margins, thresholds, correction
    factors, temporal smoothing, or transition constraints before clinical use.
  comparator: Using raw, independent model predictions without post-processing
  technology:
  - imaging_diagnostic
  - predictive_risk
  aim: Remove implausible spatial errors and spurious flickering predictions, improving output accuracy
  variants:
  - Largest connected component selection
  - Anatomical constraints
  - Margins and thresholds
  - Correction factors
  - Moving-average temporal smoothing
  - Transition constraints
  - Sequence decoding
  proposed_by_studies: 13
  proposed_by_commentaries: 0
  status: machine_draft
- id: T015
  key: false_positive_alert_filter
  family: output_filtering
  question: Should we add a second-stage filter to remove false-positive AI alerts before they reach reviewers?
  control: Apply a second-stage AI or rule-based exclusion filter that suppresses likely false-positive alerts already
    generated by the first-stage model.
  comparator: Forwarding all first-stage alerts to reviewers
  technology:
  - predictive_risk
  - imaging_diagnostic
  aim: Reduce alert burden and reviewer workload while preserving detection of true cases
  variants:
  - Second-stage AI filter
  - Rule-based exclusion criteria
  proposed_by_studies: 5
  proposed_by_commentaries: 0
  status: machine_draft
- id: T016
  key: similar_case_retrieval
  family: grounding_retrieval
  question: Should the AI retrieve similar past patient cases or worked examples to inform its output?
  control: Retrieve similar prior cases, plans or clinician-edited examples from a case library and supply them
    as context, few-shot examples or prediction inputs.
  comparator: No retrieved cases, fixed examples, or guideline-only single-source retrieval
  technology:
  - generative_llm
  - predictive_risk
  aim: Improve accuracy and relevance of outputs by drawing on comparable real cases
  variants:
  - Nearest-neighbor patient cases blended with model predictions
  - Dynamically retrieved similar worked examples as few-shot prompts instead of zero-shot or fixed examples
  - Dual-source retrieval combining guidelines with past cases, peer narratives or live web search
  proposed_by_studies: 37
  proposed_by_commentaries: 0
  status: machine_draft
- id: T017
  key: knowledge_graph_retrieval
  family: grounding_retrieval
  question: Should we ground the model in a structured clinical knowledge graph instead of plain text-chunk vector
    search?
  control: Retrieve from a curated clinical knowledge graph, using entity normalization and graph traversal, to
    ground or check model outputs.
  comparator: Vector retrieval over unstructured text chunks, or no retrieval
  technology:
  - generative_llm
  - speech_ambient
  aim: Improve factual accuracy and multi-hop reasoning; catch omitted clinical concepts
  variants:
  - GraphRAG with entities, relations and community summaries
  - Knowledge-graph comparison of transcript and ambient note concepts to direct LLM restoration of omissions
  proposed_by_studies: 46
  proposed_by_commentaries: 0
  status: machine_draft
- id: T018
  key: query_transformation
  family: grounding_retrieval
  question: Should we rewrite, expand or decompose user queries, or route them by question type, before retrieval?
  control: Transform the user's query into clinical search terms or sub-questions, or route it by question type,
    before a single retrieval pass.
  comparator: Original user query sent through one fixed search route
  technology:
  - generative_llm
  - agentic
  aim: Retrieve more complete, relevant evidence for complex or ambiguously worded clinical questions
  variants:
  - Query rewriting or expansion into clinical terminology, other choices fixed
  - Decomposition of complex questions into sub-queries
  - Query-type routing versus a fixed search route, evaluated separately
  proposed_by_studies: 16
  proposed_by_commentaries: 0
  status: machine_draft
- id: T019
  key: iterative_retrieval_support_verification
  family: grounding_retrieval
  question: Should the AI check whether evidence suffices and supports its answer, re-searching or correcting when
    it does not?
  control: Check evidence sufficiency and answer support against sources; re-retrieve, correct, or withhold unsupported
    claims before release.
  comparator: Single-pass retrieval and generation, answer left unchecked
  technology:
  - generative_llm
  - agentic
  aim: Prevent incomplete-evidence answers and claims not supported by retrieved sources
  variants:
  - Iterative retrieval until sufficiency check passes, versus single-pass, verification fixed
  - Re-search on conflicting evidence; forced lookups for entity questions
  - Post-generation support verification with correction or blocking of unsupported claims, same retrieved evidence
  proposed_by_studies: 21
  proposed_by_commentaries: 0
  status: machine_draft
- id: T020
  key: hybrid_retrieval
  family: grounding_retrieval
  question: Should we combine keyword search with semantic vector search?
  control: Combine sparse keyword (BM25) and dense embedding retrieval, fused by rank fusion, holding any reranking
    step fixed.
  comparator: Keyword-only or embedding-only retrieval
  technology:
  - generative_llm
  aim: Improve recall and precision of retrieved clinical passages
  variants:
  - Reciprocal rank fusion
  - Weighted score fusion
  proposed_by_studies: 25
  proposed_by_commentaries: 0
  status: machine_draft
- id: T021
  key: rerank_filter_passages
  family: grounding_retrieval
  question: Should we rerank and filter retrieved passages before the LLM sees them?
  control: Rerank candidate passages and drop those scoring low on relevance, evidence quality, recency or consistency
    before generation.
  comparator: Initial-ranking top-k passages passed unchanged to generation
  technology:
  - generative_llm
  aim: Prevent answers built on irrelevant, weak, outdated or contradictory evidence
  variants:
  - Cross-encoder reranking versus initial ranking, same candidates
  - Evidence-hierarchy or recency weighting
  - Pre-generation relevance or contradiction filter
  proposed_by_studies: 12
  proposed_by_commentaries: 0
  status: machine_draft
- id: T022
  key: require_citations
  family: grounding_retrieval
  question: Should we require the AI to cite the exact source text behind each claim?
  control: Link every generated statement to a specific source passage or quote that clinicians can inspect.
  comparator: Generated output without required citations
  technology:
  - generative_llm
  aim: Enable clinician verification of claims against sources
  variants:
  - Verbatim quote attribution
  - Document/section/span-level citations
  proposed_by_studies: 24
  proposed_by_commentaries: 0
  status: machine_draft
- id: T023
  key: patient_ehr_grounding
  family: grounding_retrieval
  question: Should we feed the patient's own EHR data into the AI's context?
  control: Retrieve the patient's record via standards-based interfaces or structured queries and inject current
    EHR data before generation.
  comparator: Same model and knowledge access without patient-specific EHR context
  technology:
  - generative_llm
  aim: Make outputs accurate and specific to the individual patient
  variants:
  - FHIR-based integration
  - Structured database queries
  - Free-text note retrieval
  - Deterministic injection of current EHR state
  proposed_by_studies: 19
  proposed_by_commentaries: 0
  status: machine_draft
- id: T024
  key: tune_embeddings
  family: grounding_retrieval
  question: Should we benchmark and tune the embedding model and number of retrieved passages for our clinical use?
  control: Select or fine-tune embeddings using local labeled clinical data, and tune top-k as a separate comparison
    with the embedding fixed.
  comparator: Default general-purpose embeddings and default top-k
  technology:
  - generative_llm
  aim: Improve retrieval accuracy on clinical language
  variants:
  - Embedding benchmarking on local corpus, top-k fixed
  - Domain fine-tuning of embeddings, top-k fixed
  - Top-k tuning, embedding model fixed
  proposed_by_studies: 12
  proposed_by_commentaries: 0
  status: machine_draft
- id: T025
  key: restrict_curated_local_sources
  family: grounding_retrieval
  question: Should we limit what the AI can retrieve to vetted authoritative sources, prioritizing locally relevant
    ones?
  control: Restrict retrieval to a vetted corpus, disabling open web search and superseded documents; add local
    sources where local practice differs.
  comparator: Open web search or broad unvetted corpus
  technology:
  - generative_llm
  aim: Prevent unreliable or locally inapplicable guidance
  variants:
  - Whitelisted authoritative domains versus unrestricted access
  - Excluding superseded documents
  - Local guidelines, formularies, test menus, resistance data and community resources versus generic international
    guidance within a vetted corpus
  proposed_by_studies: 24
  proposed_by_commentaries: 0
  status: machine_draft
- id: T026
  key: rag_context_supply
  family: grounding_retrieval
  question: Should the LLM answer from retrieved trusted passages, from full content placed in its prompt, or from
    training knowledge alone?
  control: Retrieve relevant passages from guidelines, institutional documents, literature or the record and supply
    them to the LLM before it answers.
  comparator: Training knowledge alone, or full content in a long-context/static prompt
  technology:
  - generative_llm
  aim: Reduce hallucinations and outdated answers while balancing accuracy, cost and simplicity
  variants:
  - Guideline-based RAG versus no retrieval
  - Institutional document RAG
  - Literature RAG
  - Retrieved EHR excerpts versus full patient record in long-context model
  - Static structured knowledge table in prompt for small closed domains versus vector RAG
  proposed_by_studies: 74
  proposed_by_commentaries: 2
  status: machine_draft
- id: T027
  key: curate_maintain_knowledge_base
  family: grounding_retrieval
  question: Should we invest in cleaning, restructuring and regularly updating the retrieval knowledge base?
  control: Restructure, deduplicate and conflict-check source documents before indexing, and regularly refresh the
    indexed corpus.
  comparator: Raw documents ingested once without curation or updates
  technology:
  - generative_llm
  aim: Prevent retrieval of outdated, duplicate or conflicting content
  variants:
  - Preprocessing (deduplication, conflict checking) versus raw ingestion, same source snapshot
  - Scheduled refresh versus static corpus, same preprocessing
  proposed_by_studies: 11
  proposed_by_commentaries: 0
  status: machine_draft
- id: T028
  key: chunking_strategy
  family: grounding_retrieval
  question: Should our RAG pipeline split documents by structure and meaning rather than fixed length?
  control: Use structure- or semantics-aware chunking based on headings, HTML structure or semantic boundaries with
    micro-headers.
  comparator: Fixed-length or naive sentence chunking
  technology:
  - generative_llm
  aim: Keep clinically coherent passages intact to improve retrieval quality
  variants:
  - Heading-based chunking
  - HTML-structure chunking
  - Semantic chunking with micro-headers
  proposed_by_studies: 7
  proposed_by_commentaries: 0
  status: machine_draft
- id: T029
  key: candidate_retrieval_for_coding
  family: grounding_retrieval
  question: For medical coding and terminology mapping, should we retrieve candidate codes and have the LLM choose
    only among them?
  control: Retrieve candidate codes or ontology terms and constrain the LLM to select from that shortlist.
  comparator: Free LLM code generation, dictionary tools or embedding classifiers alone
  technology:
  - generative_llm
  aim: Reduce invalid or hallucinated codes and improve coding accuracy
  variants:
  - ICD-10
  - SNOMED CT
  - HPO
  - LOINC
  - RxNorm
  proposed_by_studies: 16
  proposed_by_commentaries: 0
  status: machine_draft
- id: T030
  key: vetted_content_library
  family: grounding_retrieval
  question: 'Which response policy should patient-facing chatbots use: library-only vetted answers, vetted answers
    with LLM fallback, or fully generative?'
  control: 'Answer from a clinician-validated content library via LLM intent matching, with explicit unmatched-query
    behavior: decline/escalate, or labeled generative fallback.'
  comparator: Fully generative LLM responses, with or without RAG
  technology:
  - generative_llm
  aim: Prevent unsafe or inaccurate free-text answers to patients
  variants:
  - 'Library-only: only clinician-vetted answers; unmatched queries declined or escalated'
  - Library-first with generative LLM fallback for unmatched queries
  proposed_by_studies: 10
  proposed_by_commentaries: 0
  status: machine_draft
- id: T031
  key: llm_as_judge_evaluation
  family: verification_ensembles
  question: Should we use an LLM as a judge to score clinical AI outputs instead of having expert clinicians review
    everything?
  control: Use an LLM judge with a clinician-defined rubric to score AI-generated content at scale, calibrated and
    spot-checked against expert ratings.
  comparator: Expert clinician or physician review of every output
  technology:
  - generative_llm
  aim: Scale quality, safety, and compliance evaluation while keeping agreement with expert judgment
  variants:
  - Clinician-defined fixed rubric
  - Auto-generated case-specific rubrics via retrieval and multi-model consensus, expert-audited
  - Small fine-tuned, distilled, or local-language judge model instead of a general-purpose large model
  - Judge from a different model family than the generator
  - Judge blinded to which model produced each answer
  - Periodic spot-check calibration against expert ratings
  proposed_by_studies: 64
  proposed_by_commentaries: 0
  status: machine_draft
- id: T032
  key: critic_verifier_agent
  family: verification_ensembles
  question: Should we add a separate critic or safety-monitor model that checks the primary LLM's output before
    it reaches clinicians or patients?
  control: Route outputs or whole conversations through a separate critic, verifier, or supervisory model that scores
    risk and accuracy, then revises, blocks, or escalates.
  comparator: Single-pass primary model output with only its built-in safety behavior
  technology:
  - generative_llm
  - agentic
  aim: Catch unsafe or inaccurate outputs before release
  variants:
  - Critic agent that challenges or arbitrates the primary agent
  - Critique-and-revise refinement loop
  - Runtime monitor over full conversations
  - Governance agent watching multi-agent workflow steps
  proposed_by_studies: 46
  proposed_by_commentaries: 0
  status: machine_draft
- id: T033
  key: self_consistency_sampling
  family: verification_ensembles
  question: Should we run the same LLM several times and select among the answers rather than trusting a single
    response?
  control: Sample multiple outputs from the same model and select the final answer by majority vote or cross-sample
    consistency.
  comparator: Single LLM response per query
  technology:
  - generative_llm
  aim: Improve answer accuracy and reduce random errors from a single generation
  variants:
  - Majority or aggregated vote
  - Consistency check across samples
  - 'Alternative selection rule: best-of-N ranking by a trained verifier with capped verification depth, compared
    on the same candidate set'
  proposed_by_studies: 29
  proposed_by_commentaries: 0
  status: machine_draft
- id: T034
  key: llm_second_reader_documents
  family: verification_ensembles
  question: Should we use an LLM as a second reader to flag or fix errors in clinician-written reports, notes, transcripts,
    and calculations?
  control: Run an LLM over clinician-authored or machine-transcribed reports, notes, messages, transcripts, or calculations
    to flag or correct errors and omissions before finalization.
  comparator: Clinician self-review or standard proofreading without AI check
  technology:
  - generative_llm
  - speech_ambient
  aim: Reduce documentation errors, mismatches, and omissions reaching the record
  variants:
  - Flag-only for human correction
  - LLM post-processing of ASR transcripts to fix word errors and speaker attribution
  - Checking calculations and laterality mismatches in reports
  proposed_by_studies: 27
  proposed_by_commentaries: 0
  status: machine_draft
- id: T035
  key: predictive_model_ensembles
  family: verification_ensembles
  question: Should we deploy an ensemble of several predictive models instead of the single best-performing model?
  control: Combine predictions from multiple trained models using a pre-specified combination rule and deploy the
    ensemble in place of one model.
  comparator: Single best-performing model

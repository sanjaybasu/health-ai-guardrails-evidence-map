# Guardrail Evidence Map configuration. Model ids were checked against each vendor's live model list on 2026-09-28.
models:
  panel:                       # independent extractors for guardrail-testing studies and endorsements
    claude: claude-opus-5-5
    openai: gpt-6-astra
    gemini: gemini-3.1-pro-preview
  fast_panel:                  # three vendors for offline or simulated tests of a practice (evidence level 4)
    claude: claude-sonnet-5-5
    openai: gpt-5.5
    gemini: gemini-3.8-flash
  screen: {vendor: gemini, model: gemini-3.8-flash}
  screen_audit: {vendor: claude, model: claude-sonnet-5-5}   # re-screens a random sample of exclusions
  hazard: {vendor: claude, model: claude-sonnet-5-5}          # single-model extraction for hazard-only studies
  merge: {vendor: claude, model: claude-opus-5-5}             # taxonomy merge and adjudication fallback
  embed: {vendor: openai, model: text-embedding-3-large}

# USD per million tokens. Placeholders are marked; the ledger records tokens so costs can be re-priced.
prices_per_mtok:
  claude-opus-5-5: {in: 4.0, out: 20.0}
  claude-sonnet-5-5: {in: 2.0, out: 10.0}      # placeholder
  gpt-6-astra: {in: 10.0, out: 40.0}           # placeholder
  gpt-5.5: {in: 5.0, out: 20.0}                # placeholder
  gemini-3.1-pro-preview: {in: 2.0, out: 12.0} # placeholder
  gemini-3.8-flash: {in: 0.3, out: 2.5}        # placeholder
  text-embedding-3-large: {in: 0.13, out: 0.0}

budget:
  per_run_usd: 40
  monthly_usd: 150
  # One-time build and backfill spend (through launch) does not count toward the steady-state monthly cap.
  count_from: "2026-09-30T00:00:00"

search:
  since: "2023-01-01"
  # Each term group is restricted to title and abstract; Europe PMC otherwise searches open-access full text.
  europepmc_queries:
    llm: >-
      TITLE_ABS:("large language model" OR "large language models" OR "large-language model" OR LLM OR LLMs OR
      "generative artificial intelligence" OR "generative AI" OR ChatGPT OR GPT-4 OR GPT-4o OR chatbot OR chatbots OR
      "conversational agent" OR "ambient scribe" OR "AI scribe" OR "ambient AI")
      AND TITLE_ABS:(patient OR patients OR clinician OR clinicians OR physician OR physicians OR nurse OR nurses OR
      hospital OR "health system" OR "primary care" OR clinical OR Medicaid)
      AND TITLE_ABS:(deployment OR deployed OR implementation OR "real-world" OR pilot OR randomized OR randomised OR
      trial OR safety OR harm OR harms OR error OR errors OR guardrail OR guardrails OR governance OR oversight OR
      "human review" OR "human oversight" OR disclosure OR readability OR literacy OR "limited English" OR translation OR
      equity OR bias OR monitoring OR hallucination OR hallucinations OR escalation OR "patient portal" OR inbox)
    ai_deployment: >-
      TITLE_ABS:("artificial intelligence" OR "machine learning" OR "deep learning" OR "large language model" OR
      "large language models" OR LLM OR LLMs OR "generative AI" OR ChatGPT OR chatbot OR "foundation model" OR
      "prediction model" OR "predictive model" OR "risk prediction" OR "early warning score" OR
      "clinical decision support" OR "computer-aided detection" OR "ambient scribe" OR "AI agent" OR "world model" OR
      "digital twin")
      AND TITLE_ABS:(patient OR patients OR clinician OR clinicians OR physician OR physicians OR nurse OR nurses OR
      hospital OR "health system" OR "primary care" OR clinical OR Medicaid OR radiology OR "emergency department")
      AND TITLE_ABS:(deployment OR deployed OR implementation OR implemented OR "real-world" OR "silent mode" OR
      "silent trial" OR "stepped-wedge" OR "pragmatic trial" OR "cluster randomized" OR governance OR oversight OR
      "human-in-the-loop" OR "alert fatigue" OR "automation bias" OR "model drift" OR "dataset shift" OR
      "local validation" OR recalibration OR disclosure OR "limited English" OR guardrail OR guardrails OR
      "post-deployment" OR postmarket)
  arxiv_query: >-
    (abs:"large language model" OR abs:LLM OR abs:chatbot) AND (abs:clinical OR abs:patient OR abs:medical OR
    abs:healthcare) AND (abs:safety OR abs:deployment OR abs:guardrail OR abs:evaluation OR abs:harm)
  arxiv_categories: [cs.CL, cs.AI, cs.CY, cs.HC, cs.LG]

quote_match_threshold: 90
screen_audit_fraction: 0.05
